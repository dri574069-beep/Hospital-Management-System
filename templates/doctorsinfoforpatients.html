<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docotrs info</title>
    {% load static %}

    <link rel="stylesheet" href="{% static 'style.CSS' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body id="docinfoforpatients">
    <br><BR><BR>
    <h1 style="text-align:center"><i class="fa-solid fa-user-doctor"></i> doctors information</h1>
    <BR><BR>
    {% for doc in docs %}   
    <div class="docsinfopatients">
        <h1><i class="fa-solid fa-signature"></i>  Name : {{doc.full_name}}</h1>
        <p><i class="fa-light fa-circle-check"></i>  Specialization : {{doc.specialization}}</p>
    </div>
    {% endfor %}
</body>
</html>
